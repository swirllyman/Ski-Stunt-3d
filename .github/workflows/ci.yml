# The smoke test as a merge gate, and the deployed build as a second one.
#
# Section 8 of SKI_STUNT_3D_PIPELINE.md says the smoke test is mandatory
# before every push, and it runs inside the Claude Code session where a red
# result is cheapest to act on. This workflow is the braces to that belt:
# it re-runs the same script on GitHub so the result shows up as a check
# next to the merge button, which is the only place it is visible on a phone.
#
# The second job is the part the local run genuinely cannot do. It waits for
# Pages to publish the commit, then opens the real URL in a real browser
# against the real CDN. That is the closest a machine gets to answering
# "will this load when I open it on the phone".

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    # Exactly one run per commit: `push` covers branches in this repo, and
    # `pull_request` picks up forks, whose push events never reach us.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Locate a browser
        run: |
          BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$BIN" ]; then
            echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
            echo "using $BIN"
          else
            echo "no browser found; the boot check will report skip"
          fi

      - name: Smoke test
        run: |
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            BASE="--base origin/${{ github.base_ref }}"
          fi
          node tools/smoke-test.mjs $BASE --markdown "$RUNNER_TEMP/smoke.md"

      - name: Publish the result where a phone can read it
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/smoke.md" ]; then
            cat "$RUNNER_TEMP/smoke.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Smoke test crashed before it could report' >> "$GITHUB_STEP_SUMMARY"
          fi

  live:
    name: Live check
    needs: smoke
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Ask GitHub which branch Pages serves and what URL it serves it at,
      # rather than assuming it is the default branch at a guessed casing.
      # Both assumptions have already been wrong once each.
      - name: Ask GitHub what Pages is actually serving
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" || echo 000)"

          if [ "$code" = "404" ]; then
            echo "::error::GitHub Pages is not enabled for this repository. Settings -> Pages -> Source: Deploy from a branch."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::The Pages API returned HTTP $code; cannot tell what is deployed."
            cat "$body"
            exit 1
          fi

          url="$(jq -r '.html_url // empty' "$body")"
          branch="$(jq -r '.source.branch // empty' "$body")"
          path="$(jq -r '.source.path // "/"' "$body")"
          status="$(jq -r '.status // "unknown"' "$body")"
          echo "Pages serves $branch $path at $url (status: $status)"

          {
            echo "url=$url"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

      - name: Not the deployed branch, nothing new to check
        if: steps.pages.outputs.branch != github.ref_name
        run: |
          {
            echo "### Live check skipped"
            echo
            echo "Pages serves \`${{ steps.pages.outputs.branch }}\`; this ran on \`${{ github.ref_name }}\`."
            echo "Nothing new is deployed, so there is nothing to drive."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Locate a browser
        if: steps.pages.outputs.branch == github.ref_name
        run: |
          BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [ -n "$BIN" ] && echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV" || echo "no browser found"

      - name: Wait for Pages, then drive the deployed build
        if: steps.pages.outputs.branch == github.ref_name
        run: |
          node tools/live-check.mjs "${{ steps.pages.outputs.url }}" --expect index.html \
            --timeout 600 --pages-grace 120 --markdown "$RUNNER_TEMP/live.md"

      - name: Publish the result where a phone can read it
        if: always() && steps.pages.outputs.branch == github.ref_name
        run: |
          if [ -f "$RUNNER_TEMP/live.md" ]; then
            cat "$RUNNER_TEMP/live.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Live check crashed before it could report' >> "$GITHUB_STEP_SUMMARY"
          fi
