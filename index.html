<title>Ski Stunt 3D</title>
<style>
  :root {
    --ink: #eaf2ff;
    --panel: rgba(9, 18, 32, 0.86);
    --edge: rgba(150, 190, 240, 0.28);
    --accent: #5ec8ff;
    --warn: #ff7a59;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0d1b2a; color: var(--ink);
    font: 14px/1.35 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; touch-action: none; display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed; left: 10px; top: calc(10px + var(--safe-t));
    padding: 8px 11px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--edge);
    backdrop-filter: blur(6px); pointer-events: none;
    font-variant-numeric: tabular-nums; min-width: 148px;
  }
  #hud .big { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  #hud .unit { font-size: 12px; opacity: 0.6; font-weight: 500; }
  #hud .row { display: flex; justify-content: space-between; gap: 14px; opacity: 0.82; font-size: 12px; }
  #hud .state { margin-top: 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: var(--accent); }
  #hud .state.crashed { color: var(--warn); }

  /* posture readout: the one number the whole game is about */
  #posture {
    position: fixed; right: 10px; top: calc(58px + var(--safe-t));
    width: 26px; height: 168px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--edge); overflow: hidden; pointer-events: none;
  }
  #posture .fill {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, var(--accent), rgba(94,200,255,0.25));
    transition: height 0.05s linear;
  }
  #posture .mark { position: absolute; left: 0; right: 0; height: 1px; background: rgba(234,242,255,0.45); }

  #toast {
    position: fixed; left: 50%; top: calc(64px + var(--safe-t)); transform: translateX(-50%);
    padding: 7px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--edge);
    font-weight: 600; opacity: 0; transition: opacity 0.25s ease; pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  #hint {
    position: fixed; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%);
    padding: 7px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--edge);
    font-size: 12px; font-weight: 600; letter-spacing: 0.4px; opacity: 0.75;
    pointer-events: none; transition: opacity 0.3s ease; white-space: nowrap;
  }
  #hint.hidden { opacity: 0; }
  /* Where the finger went down, and where it is now: the pump made visible. */
  #grab {
    position: fixed; left: 0; top: 0; width: 2px; pointer-events: none;
    background: linear-gradient(180deg, rgba(94,200,255,0), var(--accent), rgba(94,200,255,0));
    opacity: 0; transition: opacity 0.12s ease;
  }
  #grab.on { opacity: 0.9; }
  #grab .dot {
    position: absolute; left: -13px; width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--accent); background: rgba(94,200,255,0.22);
  }
  #btn-reset {
    position: fixed; right: 10px; top: calc(10px + var(--safe-t));
    padding: 9px 13px; border-radius: 12px; background: var(--panel);
    border: 1px solid var(--edge); color: var(--ink); font-weight: 700; font-size: 12px; letter-spacing: 0.6px;
  }

  #debug {
    position: fixed; left: 8px; top: calc(150px + var(--safe-t));
    width: min(330px, calc(100vw - 16px)); max-height: calc(100vh - 290px - var(--safe-t));
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px;
    backdrop-filter: blur(8px); overflow: hidden; z-index: 20;
  }
  #debug header {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-bottom: 1px solid var(--edge); font-weight: 700; letter-spacing: 0.6px; font-size: 12px;
  }
  #debug header .spacer { flex: 1; }
  #debug .body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 0 8px; }
  #debug.collapsed .body, #debug.collapsed .actions { display: none; }
  .dbg-section > .head {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 10px 12px; background: none; border: 0; border-top: 1px solid rgba(150,190,240,0.14);
    color: var(--accent); font: inherit; font-weight: 700; font-size: 12px; letter-spacing: 0.7px; text-transform: uppercase;
  }
  .dbg-section > .head .caret { transition: transform 0.15s ease; opacity: 0.7; }
  .dbg-section.closed > .head .caret { transform: rotate(-90deg); }
  .dbg-section.closed > .rows { display: none; }
  .dbg-row { padding: 6px 12px 10px; }
  .dbg-row .label { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; margin-bottom: 2px; }
  .dbg-row .label .name { opacity: 0.85; }
  .dbg-row .label .val { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); }
  .dbg-row .hint { font-size: 11px; line-height: 1.3; opacity: 0.55; margin: -1px 0 3px; }
  .dbg-section.primary > .head { color: #ffd166; border-top: 0; }
  .dbg-row.dirty .label .val { color: #ffd166; }
  .dbg-row input[type=range] {
    width: 100%; height: 34px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none;
  }
  .dbg-row input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: rgba(150,190,240,0.3); }
  .dbg-row input[type=range]::-moz-range-track { height: 5px; border-radius: 3px; background: rgba(150,190,240,0.3); }
  .dbg-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 28px; height: 28px; margin-top: -12px; border-radius: 50%;
    background: var(--accent); border: 2px solid #04101d;
  }
  .dbg-row input[type=range]::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); border: 2px solid #04101d; }
  #debug .actions { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--edge); }

   * wavelength L reaches a slope of 2*pi*A/L; once roller + chop exceed
   * tan(slopeAngle) the piste contains genuinely uphill sections, and a
   * skier with no propulsion simply stops in one. That is what happened:
   * 2*pi*1.4/26 + 2*pi*0.35/9 = 0.58 against a hill of 0.33. Keep the sum

const DEBUG = new URLSearchParams(location.search).get('debug') === '1';

/* ------------------------------------------------------------------ *
 * Helpers
 * ------------------------------------------------------------------ */
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, lag, dt) => lerp(a, b, 1 - Math.exp(-dt / Math.max(0.001, lag)));

const makeRng = (seed) => {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

const getPath = (obj, path) => {
  const parts = path.split('.');
  let node = obj;
  for (let i = 0; i < parts.length; i++) node = node[parts[i]];
  return node;
};

const setPath = (obj, path, value) => {
  const parts = path.split('.');
  let node = obj;
  for (let i = 0; i < parts.length - 1; i++) node = node[parts[i]];
  node[parts[parts.length - 1]] = value;
};

const el = (id) => document.getElementById(id);

const showToast = (text) => {
  const node = el('toast');
  node.textContent = text;
  node.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => node.classList.remove('show'), 1400);
};

const fatal = (err) => {
  probe.error = err && err.stack ? err.stack : String(err);
  const box = el('boot-error');
  box.style.display = 'block';
  box.textContent = 'Ski Stunt 3D failed to start.\n\n' + (err && err.stack ? err.stack : String(err));
};

/* ------------------------------------------------------------------ *
 * Engine state
 * ------------------------------------------------------------------ */
let renderer, scene, camera, world;
let groundMaterial, bodyMaterial, skiMaterial;
let terrain = null;
let skier = null;
let sun = null;
let hemi = null;
const clock = { last: 0, accumulator: 0 };
const camState = { pos: new THREE.Vector3(), look: new THREE.Vector3(), ready: false };

/* The pump is one continuous axis. Touching down anchors it wherever the
 * finger lands so the stroke never jumps, and from then on posture
 * tracks the finger. How FAST you slide is how hard the skier extends,
 * which is the whole point: the pop is analog, not a button. */
const pointerState = { active: false, anchorY: 0, anchorPosture: 0.5, target: 0.5, x: 0, y: 0 };

const probe = { booted: false, frames: 0, gl: false, debug: false, error: null, run: null, config: null, pointer: null };
window.__ski = probe;

const run = {
  state: 'ready',
  posture: 0.45,
  distance: 0,
  momentum: 0,
  airTime: 0,
  lastAirTime: 0,
  crashTimer: 0,
  groundedFor: 0,
  airborneFor: 0,
};

/* ------------------------------------------------------------------ *
 * Terrain — a 1D profile. Gameplay is planar, so height is a function of
 * distance alone and the hill is that curve extruded sideways. Rollers
 * are not decoration: their compressions are the only thing there is to
 * pump against, and pumping is the only way to gain speed.
 * ------------------------------------------------------------------ */
const heightAt = (z) => {
  const t = terrain;
  const d = -z;
  let h = z * Math.tan(CONFIG.terrain.slopeAngle);
  const fade = clamp(d / 18, 0, 1);
  h += CONFIG.terrain.rollerAmp * fade *
    Math.sin((d / CONFIG.terrain.rollerLength) * Math.PI * 2 + t.phaseA);
  h += CONFIG.terrain.chopAmp * fade *
    Math.sin((d / CONFIG.terrain.chopLength) * Math.PI * 2 + t.phaseB);

  const u = (d - CONFIG.terrain.lipAt) / CONFIG.terrain.lipLength;
  if (u > 0 && u < 1) h += CONFIG.terrain.lipHeight * u * u;
  return h;
};

/** Surface tangent angle, radians. Positive where the hill drops away. */
const slopeAt = (z) => {
  const e = 0.35;
  return Math.atan2(heightAt(z + e) - heightAt(z - e), 2 * e);
};

const buildTerrain = () => {
  const rand = makeRng(CONFIG.terrain.seed);
  terrain = { phaseA: rand() * Math.PI * 2, phaseB: rand() * Math.PI * 2, body: null, mesh: null };

  const es = CONFIG.terrain.elementSize;
  const half = CONFIG.terrain.width * 0.5;
  const nx = Math.max(2, Math.round(CONFIG.terrain.width / es) + 1);
  const nz = Math.max(2, Math.round(CONFIG.terrain.length / es) + 1);

  const profile = new Array(nz);
  for (let j = 0; j < nz; j++) profile[j] = heightAt(-(j * es));

  const matrix = [];
  for (let i = 0; i < nx; i++) matrix.push(profile.slice());

  const shape = new CANNON.Heightfield(matrix, { elementSize: es });
  shape.material = groundMaterial;
  const body = new CANNON.Body({ mass: 0, material: groundMaterial });
  body.addShape(shape);
  body.position.set(-half, 0, 0);
  body.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
  world.addBody(body);
  terrain.body = body;

  const positions = new Float32Array(nx * nz * 3);
  const colors = new Float32Array(nx * nz * 3);
  const piste = new THREE.Color(0xf2f7ff);
  const band = new THREE.Color(0xd6e6f8);
  const edge = new THREE.Color(0x7d8ea3);
  for (let i = 0; i < nx; i++) {
    for (let j = 0; j < nz; j++) {
      const k = (i * nz + j) * 3;
      const x = i * es - half;
      positions[k] = x;
      positions[k + 1] = profile[j];
      positions[k + 2] = -(j * es);
      const off = clamp((Math.abs(x) - half + 5) / 5, 0, 1);
      const stripe = Math.floor((j * es) / 20) % 2 === 0 ? 0 : 1;
      const c = piste.clone().lerp(band, stripe * 0.55).lerp(edge, off);
      colors[k] = c.r;
      colors[k + 1] = c.g;
      colors[k + 2] = c.b;
    }
  }
  const indices = [];
  for (let i = 0; i < nx - 1; i++) {
    for (let j = 0; j < nz - 1; j++) {
      const a = i * nz + j;
      indices.push(a, (i + 1) * nz + j, a + 1, a + 1, (i + 1) * nz + j, (i + 1) * nz + j + 1);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
  mesh.receiveShadow = true;
  scene.add(mesh);
  terrain.mesh = mesh;
};

/* ------------------------------------------------------------------ *
 * Skier — six effective joints, limbs mirrored, locked to the sagittal
 * plane. The lock is what buys the low joint count: cannon's linear and
 * angular factors mask the out-of-plane components in the integrator, so
 * every body can only travel in ZY and only rotate about X. A rig that
 * cannot leave the plane cannot do the splits, cannot corkscrew, and
 * needs no cone limits to keep it honest.
 * ------------------------------------------------------------------ */
const PARTS = [
  { name: 'pelvis', kind: 'box', size: [0.16, 0.11, 0.13], mass: 10, group: 'core', color: 0xff8c42 },
  { name: 'torso', kind: 'box', size: [0.19, 0.24, 0.14], mass: 16, group: 'core', color: 0xff6b35 },
  { name: 'head', kind: 'sphere', size: [0.13], mass: 4, group: 'core', color: 0xffd9b3 },
  { name: 'armL', kind: 'box', size: [0.055, 0.26, 0.055], mass: 3.4, group: 'limb', color: 0xffb703 },
  { name: 'armR', kind: 'box', size: [0.055, 0.26, 0.055], mass: 3.4, group: 'limb', color: 0xffb703 },
  { name: 'thighL', kind: 'box', size: [0.085, 0.21, 0.085], mass: 6.5, group: 'limb', color: 0x2a9d8f },
  { name: 'thighR', kind: 'box', size: [0.085, 0.21, 0.085], mass: 6.5, group: 'limb', color: 0x2a9d8f },
  { name: 'shinL', kind: 'box', size: [0.07, 0.22, 0.07], mass: 4.5, group: 'limb', color: 0x1d7874 },
  { name: 'shinR', kind: 'box', size: [0.07, 0.22, 0.07], mass: 4.5, group: 'limb', color: 0x1d7874 },
  { name: 'skiL', kind: 'ski', size: [0.06, 0.02, 0.85], mass: 1.6, group: 'limb', color: 0xef476f },
  { name: 'skiR', kind: 'ski', size: [0.06, 0.02, 0.85], mass: 1.6, group: 'limb', color: 0xef476f },
];

/* Six logical joints. The mirrored pairs share one posture target, which
 * is what "both legs treated as one" means in practice. */
const JOINTS = [
  { name: 'spine', a: 'pelvis', b: 'torso', pa: [0, 0.11, 0], pb: [0, -0.24, 0], posture: 'spine' },
  { name: 'neck', a: 'torso', b: 'head', pa: [0, 0.24, 0], pb: [0, -0.13, 0], posture: 'neck', loose: true },
  { name: 'shoulderL', a: 'torso', b: 'armL', pa: [-0.245, 0.18, 0], pb: [0, 0.26, 0], posture: 'shoulder' },
  { name: 'shoulderR', a: 'torso', b: 'armR', pa: [0.245, 0.18, 0], pb: [0, 0.26, 0], posture: 'shoulder' },
  { name: 'hipL', a: 'pelvis', b: 'thighL', pa: [-0.11, -0.11, 0], pb: [0, 0.21, 0], posture: 'hip' },
  { name: 'hipR', a: 'pelvis', b: 'thighR', pa: [0.11, -0.11, 0], pb: [0, 0.21, 0], posture: 'hip' },
  { name: 'kneeL', a: 'thighL', b: 'shinL', pa: [0, -0.21, 0], pb: [0, 0.22, 0], posture: 'knee' },
  { name: 'kneeR', a: 'thighR', b: 'shinR', pa: [0, -0.21, 0], pb: [0, 0.22, 0], posture: 'knee' },
  { name: 'ankleL', a: 'shinL', b: 'skiL', pa: [0, -0.22, 0], pb: [0, 0.02, 0.1], posture: 'ankle' },
  { name: 'ankleR', a: 'shinR', b: 'skiR', pa: [0, -0.22, 0], pb: [0, 0.02, 0.1], posture: 'ankle' },
];

const PLANE_LINEAR = new CANNON.Vec3(0, 1, 1);
const PLANE_ANGULAR = new CANNON.Vec3(1, 0, 0);

/* Current target angle per logical joint, refreshed every step from the
 * single control axis. Written out longhand rather than looked up by
 * name so that every CONFIG key appears literally in the source — the
 * smoke test's CONFIG check reads the text, not the runtime. */
const postureTargets = { spine: 0, neck: 0, shoulder: 0, hip: 0, knee: 0, ankle: 0 };

const updatePostureTargets = () => {
  const t = run.posture;
  postureTargets.spine = lerp(CONFIG.crouch.spine, CONFIG.extend.spine, t);
  postureTargets.neck = lerp(CONFIG.crouch.neck, CONFIG.extend.neck, t);
  postureTargets.shoulder = lerp(CONFIG.crouch.shoulder, CONFIG.extend.shoulder, t);
  postureTargets.hip = lerp(CONFIG.crouch.hip, CONFIG.extend.hip, t);
  postureTargets.knee = lerp(CONFIG.crouch.knee, CONFIG.extend.knee, t);
  postureTargets.ankle = lerp(CONFIG.crouch.ankle, CONFIG.extend.ankle, t);
};

const jointTarget = (joint) => postureTargets[joint.posture];

/**
 * Forward kinematics down the joint list, which is in parent-before-child
 * order. Spawning in the pose the muscles already want means the PD
 * controller starts at zero error instead of kicking the rig apart.
 */
const layoutSkier = (originZ) => {
  const layout = {};
  layout.pelvis = { pos: new CANNON.Vec3(0, 0, originZ), quat: new CANNON.Quaternion(0, 0, 0, 1) };
  const pivot = new CANNON.Vec3();

  for (let i = 0; i < JOINTS.length; i++) {
    const j = JOINTS[i];
    const parent = layout[j.a];
    const local = new CANNON.Quaternion();
    local.setFromEuler(jointTarget(j), 0, 0, 'XYZ');
    const quat = new CANNON.Quaternion();
    parent.quat.mult(local, quat);

    parent.quat.vmult(new CANNON.Vec3(j.pa[0], j.pa[1], j.pa[2]), pivot);
    const worldPivot = parent.pos.vadd(pivot);
    quat.vmult(new CANNON.Vec3(j.pb[0], j.pb[1], j.pb[2]), pivot);
    layout[j.b] = { pos: worldPivot.vsub(pivot), quat: quat };
  }

  /* Stand the rig up square to the SLOPE, not to the world. Spawning
   * vertical on a hill buries one ski end, and a buried tip does not
   * slide — it jams, which read as "the skier is stuck" for a long time
   * before it read as "the skier is planted at the wrong angle". */
  const tilt = -slopeAt(originZ);
  const spin = new CANNON.Quaternion();
  spin.setFromEuler(tilt, 0, 0, 'XYZ');
  const names = Object.keys(layout);
  for (let i = 0; i < names.length; i++) {
    const node = layout[names[i]];
    const dy = node.pos.y;
    const dz = node.pos.z - originZ;
    node.pos.y = dy * Math.cos(tilt) - dz * Math.sin(tilt);
    node.pos.z = originZ + dy * Math.sin(tilt) + dz * Math.cos(tilt);
    const turned = new CANNON.Quaternion();
    spin.mult(node.quat, turned);
    node.quat = turned;
  }

  /* Clearance measured along the whole ski, not just at its centre. */
  let lift = -Infinity;
  const skis = ['skiL', 'skiR'];
  const end = new CANNON.Vec3();
  for (let i = 0; i < skis.length; i++) {
    const node = layout[skis[i]];
    for (let t = -1; t <= 1; t += 0.25) {
      node.quat.vmult(new CANNON.Vec3(0, -0.02, t * 0.85), end);
      const py = node.pos.y + end.y;
      const pz = node.pos.z + end.z;
      lift = Math.max(lift, heightAt(pz) - py);
    }
  }
  for (let i = 0; i < names.length; i++) layout[names[i]].pos.y += lift + 0.04;
  return layout;
};

const buildSkier = () => {
  if (skier) {
    for (let i = 0; i < skier.constraints.length; i++) world.removeConstraint(skier.constraints[i]);
    for (let i = 0; i < skier.order.length; i++) {
      world.removeBody(skier.bodies[skier.order[i]]);
      scene.remove(skier.meshes[skier.order[i]]);
    }
  }

  updatePostureTargets();
  const originZ = -6;
  const layout = layoutSkier(originZ);
  const bodies = {};
  const meshes = {};
  const order = [];
  let totalMass = 0;

  for (let i = 0; i < PARTS.length; i++) {
    const p = PARTS[i];
    const scale = p.group === 'core' ? CONFIG.ragdoll.torsoMassScale : CONFIG.ragdoll.limbMassScale;
    const mass = p.mass * scale;
    const body = new CANNON.Body({
      mass: mass,
      material: p.kind === 'ski' ? skiMaterial : bodyMaterial,
      linearDamping: CONFIG.physics.airDrag,
      angularDamping: CONFIG.physics.angularDrag,
    });

    let mesh;
    if (p.kind === 'sphere') {
      body.addShape(new CANNON.Sphere(p.size[0]));
      mesh = new THREE.Mesh(new THREE.SphereGeometry(p.size[0], 14, 10), new THREE.MeshLambertMaterial({ color: p.color }));
    } else {
      const shape = new CANNON.Box(new CANNON.Vec3(p.size[0], p.size[1], p.size[2]));
      if (p.kind === 'ski') shape.material = skiMaterial;
      body.addShape(shape);
      mesh = new THREE.Mesh(
        new THREE.BoxGeometry(p.size[0] * 2, p.size[1] * 2, p.size[2] * 2),
        new THREE.MeshLambertMaterial({ color: p.color })
      );
    }
    mesh.castShadow = true;

    body.position.copy(layout[p.name].pos);
    body.quaternion.copy(layout[p.name].quat);
    body.allowSleep = false;
    body.linearFactor.copy(PLANE_LINEAR);
    body.angularFactor.copy(PLANE_ANGULAR);
    world.addBody(body);
    scene.add(mesh);
    bodies[p.name] = body;
    meshes[p.name] = mesh;
    order.push(p.name);
    totalMass += mass;
  }

  const constraints = [];
  for (let i = 0; i < JOINTS.length; i++) {
    const j = JOINTS[i];
    /* Point-to-point, not a hinge. In the plane, angularFactor already
     * forbids every rotation but X, so a hinge's two rotational equations
     * have nothing left to do — and worse, the solver's response to them
     * is masked away, so they never converge, run every iteration, and
     * starve the contact equations sharing the same solver. That is what
     * made the rig collapse where it stood and then detonate at 7 km/s
     * when the muscles were stiffened. A pivot plus the plane lock IS a
     * hinge about X, with nothing for the solver to fight. */
    const c = new CANNON.PointToPointConstraint(
      bodies[j.a], new CANNON.Vec3(j.pa[0], j.pa[1], j.pa[2]),
      bodies[j.b], new CANNON.Vec3(j.pb[0], j.pb[1], j.pb[2])
    );
    c.collideConnected = false;
    world.addConstraint(c);
    constraints.push(c);
  }

  skier = {
    bodies: bodies,
    meshes: meshes,
    order: order,
    constraints: constraints,
    totalMass: totalMass,
    startZ: originZ,
  };
};

/* ---- torque helpers, all inertia-aware so one gain means one thing ---- */
const tmpQa = new CANNON.Quaternion();
const tmpQb = new CANNON.Quaternion();
const tmpQc = new CANNON.Quaternion();
const tmpVec = new CANNON.Vec3();
const tmpVec2 = new CANNON.Vec3();
const tmpVec3 = new CANNON.Vec3();
const tmpAccel = new CANNON.Vec3();
const tmpLocal = new CANNON.Vec3();
const tmpTorque = new CANNON.Vec3();

const inertiaAbout = (body, x, y, z) => {
  tmpAccel.set(x, y, z);
  body.vectorToLocalFrame(tmpAccel, tmpLocal);
  return body.inertia.x * tmpLocal.x * tmpLocal.x +
         body.inertia.y * tmpLocal.y * tmpLocal.y +
         body.inertia.z * tmpLocal.z * tmpLocal.z;
};

/**
 * Everything rotates about world X, so a joint's whole state is one
 * angle and one rate. Driving that scalar directly — rather than a
 * quaternion error — is both cheaper and far easier to reason about
 * when tuning by thumb, which is the whole point of the panel.
 */
const pitchOf = (body) => {
  const q = body.quaternion;
  return Math.atan2(2 * (q.w * q.x + q.y * q.z), 1 - 2 * (q.x * q.x + q.y * q.y));
};

const driveJoint = (parent, child, targetAngle, stiffness, damping) => {
  let error = targetAngle - (pitchOf(child) - pitchOf(parent));
  while (error > Math.PI) error -= Math.PI * 2;
  while (error < -Math.PI) error += Math.PI * 2;
  const rate = child.angularVelocity.x - parent.angularVelocity.x;
  const accel = error * stiffness - rate * damping;

  const ic = inertiaAbout(child, 1, 0, 0);
  const ip = inertiaAbout(parent, 1, 0, 0);
  const reduced = (ic * ip) / (ic + ip + 1e-9);
  /* Holding a bent leg under load needs gains high enough that a single
   * hard contact can otherwise pump energy in faster than damping takes
   * it out — which ended runs at five figures of metres per second. The
   * ceiling bounds what one step can inject without weakening the muscle
   * anywhere it is actually working. */
  const cap = CONFIG.ragdoll.maxJointTorque;
  tmpTorque.set(clamp(accel * reduced, -cap, cap), 0, 0);
  child.torque.vadd(tmpTorque, child.torque);
  parent.torque.vsub(tmpTorque, parent.torque);
};

const driveMuscles = (stiffnessScale) => {
  updatePostureTargets();
  for (let i = 0; i < JOINTS.length; i++) {
    const j = JOINTS[i];
    const loose = j.loose === true;
    driveJoint(
      skier.bodies[j.a],
      skier.bodies[j.b],
      jointTarget(j),
      (loose ? CONFIG.ragdoll.headStiffness : CONFIG.ragdoll.muscleStiffness) * stiffnessScale,
      (loose ? CONFIG.ragdoll.headDamping : CONFIG.ragdoll.muscleDamping) * stiffnessScale
    );
  }
};

/**
 * Postural reflex: an angular acceleration of the whole rig about its own
 * centre of mass, delivered as force as well as torque.
 *
 * Muscles alone cannot do this and it is worth being precise about why.
 * Standing a 60 kg skier up is a ~400 N*m job, while the sum of the
 * limbs' own inertias is under 1 kg*m^2 — so a shared angular
 * acceleration buys tens of N*m and the rig lies down anyway, which is
 * exactly what it did. The missing term is m*r^2, and reaching it needs
 * force: every body gets the linear acceleration it would have under a
 * rigid rotation about the centre of mass, alpha x d, plus its own
 * I*alpha of spin. Net force zero, net torque I_com * alpha, no joint
 * stress. Set balanceStiffness to 0 for a pure flop.
 */
const applyRigAccel = (accelX) => {
  let mass = 0;
  let comY = 0;
  let comZ = 0;
  for (let i = 0; i < skier.order.length; i++) {
    const body = skier.bodies[skier.order[i]];
    mass += body.mass;
    comY += body.position.y * body.mass;
    comZ += body.position.z * body.mass;
  }
  if (mass <= 0) return;
  comY /= mass;
  comZ /= mass;

  for (let i = 0; i < skier.order.length; i++) {
    const body = skier.bodies[skier.order[i]];
    const dy = body.position.y - comY;
    const dz = body.position.z - comZ;
    /* (alpha,0,0) x (0,dy,dz) = (0, -alpha*dz, alpha*dy) */
    tmpVec.set(0, -accelX * dz * body.mass, accelX * dy * body.mass);
    body.force.vadd(tmpVec, body.force);
    tmpTorque.set(inertiaAbout(body, 1, 0, 0) * accelX, 0, 0);
    body.torque.vadd(tmpTorque, body.torque);
  }
};

const applyBalance = () => {
  const pelvis = skier.bodies.pelvis;
  const target = -slopeAt(pelvis.position.z) + CONFIG.ragdoll.leanBias;
  let error = target - pitchOf(pelvis);
  while (error > Math.PI) error -= Math.PI * 2;
  while (error < -Math.PI) error += Math.PI * 2;
  applyRigAccel(error * CONFIG.ragdoll.balanceStiffness -
    pelvis.angularVelocity.x * CONFIG.ragdoll.balanceDamping);
};

/* ------------------------------------------------------------------ *
 * Skiing
 * ------------------------------------------------------------------ */
/**
 * Posture follows the finger, but not instantly: maxRate caps how fast
 * the body may be commanded to unfold. That cap is the pop ceiling — a
 * flick and a shove differ by how much of it you use, so a gentle stroke
 * gives a gentle extension and a fast one gives everything the legs
 * have. Let go and it eases back to neutral.
 */
const updatePosture = (dt) => {
  const target = pointerState.active ? pointerState.target : CONFIG.pump.neutral;
  const lag = pointerState.active ? 1 / Math.max(1, CONFIG.pump.response) : CONFIG.pump.releaseLag;
  const wanted = damp(run.posture, target, lag, dt);
  const step = CONFIG.pump.maxRate * dt;
  run.posture = clamp(run.posture + clamp(wanted - run.posture, -step, step), 0, 1);
};

const skiGrounded = (ski) => (ski.position.y - 0.02) - heightAt(ski.position.z) < CONFIG.ski.contactTolerance;

/* The ankle is a plain, deliberately soft muscle. An earlier version
 * servoed the ski flat to the surface by putting the shin's own pitch
 * inside the ankle's target — a world-space goal wired up as a relative
 * joint drive, which is a positive feedback loop. Being stiffer than the
 * muscles, it won: its reaction torque cranked the shin round and folded
 * the knee from -40 to -166 degrees inside half a second, every run.
 * A 1.7 m ski lying on a heightfield flattens itself through contact;
 * it does not need a servo, it needs an ankle that gives. */

const applyGlide = (dt, contacts) => {
  if (contacts === 0) return;
  const drag = Math.min(1, CONFIG.ski.glideDrag * dt);
  for (let i = 0; i < skier.order.length; i++) {
    const body = skier.bodies[skier.order[i]];
    tmpVec.set(0, -body.velocity.y * drag * body.mass, -body.velocity.z * drag * body.mass);
    body.applyImpulse(tmpVec);
  }
};

const crash = () => {
  if (run.state === 'crashed') return;
  run.state = 'crashed';
  run.crashTimer = 0;
  showToast('WIPEOUT');
};

const resetRun = (rebuildWorld) => {
  if (rebuildWorld) {
    world.removeBody(terrain.body);
    scene.remove(terrain.mesh);
    terrain.mesh.geometry.dispose();
    buildTerrain();
  }
  run.posture = CONFIG.pump.neutral;
  buildSkier();
  run.state = 'ready';
  run.distance = 0;
  run.momentum = 0;
  run.airTime = 0;
  run.lastAirTime = 0;
  run.crashTimer = 0;
  run.groundedFor = 0;
  run.airborneFor = 0;
  camState.ready = false;
};

const stepGame = (dt) => {
  updatePosture(dt);

  const pelvis = skier.bodies.pelvis;
  const groundedL = skiGrounded(skier.bodies.skiL);
  const groundedR = skiGrounded(skier.bodies.skiR);
  const contacts = (groundedL ? 1 : 0) + (groundedR ? 1 : 0);
  const grounded = contacts > 0;

  if (grounded) {
    run.groundedFor += dt;
    if (run.airborneFor > 0.25) run.lastAirTime = run.airborneFor;
    run.airborneFor = 0;
    if (run.state !== 'crashed') run.state = 'riding';
  } else {
    run.airborneFor += dt;
    run.groundedFor = 0;
    if (run.airborneFor > 0.08) {
      if (run.state !== 'crashed') {
        run.state = 'air';
        run.airTime += dt;
      }
    }
  }

  updatePostureTargets();
  const limp = run.state === 'crashed' ? CONFIG.ragdoll.limpStiffness : 1;

  for (let i = 0; i < JOINTS.length; i++) {
    const j = JOINTS[i];
    const parent = skier.bodies[j.a];
    const child = skier.bodies[j.b];
    if (j.posture === 'ankle') {
      driveJoint(parent, child, jointTarget(j),
        CONFIG.ski.edgeSnap * limp, CONFIG.ski.snapDamping * limp);
    } else if (j.loose === true) {
      driveJoint(parent, child, jointTarget(j),
        CONFIG.ragdoll.headStiffness * limp, CONFIG.ragdoll.headDamping * limp);
    } else {
      driveJoint(parent, child, jointTarget(j),
        CONFIG.ragdoll.muscleStiffness * limp, CONFIG.ragdoll.muscleDamping * limp);
    }
  }

  if (run.state !== 'crashed') {
    applyBalance();
    applyGlide(dt, contacts);
  }

  const spinCap = CONFIG.ragdoll.maxAngularSpeed;
  for (let i = 0; i < skier.order.length; i++) {
    const body = skier.bodies[skier.order[i]];
    body.linearDamping = CONFIG.physics.airDrag;
    body.angularDamping = CONFIG.physics.angularDrag;
    if (Math.abs(body.angularVelocity.x) > spinCap) {
      body.angularVelocity.x = Math.sign(body.angularVelocity.x) * spinCap;
    }
  }

  run.distance = Math.max(run.distance, skier.startZ - pelvis.position.z);
  const speed = Math.sqrt(pelvis.velocity.y * pelvis.velocity.y + pelvis.velocity.z * pelvis.velocity.z);
  if (speed > run.momentum) run.momentum = speed;

  /* head or torso in the snow ends the run */
  if (run.state !== 'crashed') {
    const head = skier.bodies.head.position;
    const torso = skier.bodies.torso.position;
    if (head.y - heightAt(head.z) < CONFIG.rules.crashHeight ||
        torso.y - heightAt(torso.z) < CONFIG.rules.crashHeight) crash();
  }

  if (run.state !== 'crashed' && speed < CONFIG.rules.stallSpeed) {
    run.crashTimer += dt;
    if (run.crashTimer > CONFIG.rules.stallDelay) crash();
  } else if (run.state !== 'crashed') {
    run.crashTimer = 0;
  }

  if (run.state === 'crashed') {
    run.crashTimer += dt;
    if (run.crashTimer > CONFIG.rules.crashHold) resetRun(false);
  }

  if (pelvis.position.y < heightAt(pelvis.position.z) - 6 ||
      -pelvis.position.z > CONFIG.terrain.length - 6) resetRun(false);
};

/* ------------------------------------------------------------------ *
 * Presentation
 * ------------------------------------------------------------------ */
const syncMeshes = () => {
  for (let i = 0; i < skier.order.length; i++) {
    const name = skier.order[i];
    const b = skier.bodies[name];
    const m = skier.meshes[name];
    m.position.set(b.position.x, b.position.y, b.position.z);
    m.quaternion.set(b.quaternion.x, b.quaternion.y, b.quaternion.z, b.quaternion.w);
  }
};

const updateCamera = (dt) => {
  const p = skier.bodies.pelvis.position;
  const desiredX = CONFIG.camera.side;
  const desiredY = p.y + CONFIG.camera.height;
  const desiredZ = p.z + CONFIG.camera.distance;

  if (!camState.ready) {
    camState.pos.set(desiredX, desiredY, desiredZ);
    camState.look.set(0, p.y, p.z);
    camState.ready = true;
  } else {
    camState.pos.x = damp(camState.pos.x, desiredX, CONFIG.camera.lag, dt);
    camState.pos.y = damp(camState.pos.y, desiredY, CONFIG.camera.lag, dt);
    camState.pos.z = damp(camState.pos.z, desiredZ, CONFIG.camera.lag, dt);
    camState.look.x = damp(camState.look.x, 0, CONFIG.camera.lag, dt);
    camState.look.y = damp(camState.look.y, p.y + 0.3, CONFIG.camera.lag, dt);
    camState.look.z = damp(camState.look.z, p.z - CONFIG.camera.lookAhead, CONFIG.camera.lag, dt);
  }
  camera.position.copy(camState.pos);
  camera.lookAt(camState.look);
};

let hudTimer = 0;
const updateHud = (dt) => {
  hudTimer += dt;
  if (hudTimer < 0.08) return;
  hudTimer = 0;
  const v = skier.bodies.pelvis.velocity;
  const speed = Math.sqrt(v.y * v.y + v.z * v.z) * 3.6;
  el('hud-speed').textContent = Math.round(speed);
  el('hud-momentum').textContent = Math.round(run.momentum * 3.6);
  el('hud-distance').textContent = Math.round(run.distance) + ' m';
  el('hud-air').textContent = run.airTime.toFixed(1) + ' s';
  const state = el('hud-state');
  state.textContent = run.state;
  state.classList.toggle('crashed', run.state === 'crashed');
  el('posture-fill').style.height = Math.round(run.posture * 100) + '%';
  updateGrab();
  el('posture-mark').style.bottom = Math.round(CONFIG.pump.neutral * 100) + '%';
};

/* ------------------------------------------------------------------ *
 * Input — one axis, two pads, no jump button
 * ------------------------------------------------------------------ */
const beginPump = (clientX, clientY) => {
  pointerState.active = true;
  pointerState.anchorY = clientY;
  pointerState.anchorPosture = run.posture;
  pointerState.target = run.posture;
  pointerState.x = clientX;
  pointerState.y = clientY;
  el('hint').classList.add('hidden');
};

const movePump = (clientX, clientY) => {
  if (!pointerState.active) return;
  const span = Math.max(80, window.innerHeight * CONFIG.pump.dragRange);
  pointerState.target = clamp(pointerState.anchorPosture + (pointerState.anchorY - clientY) / span, 0, 1);
  pointerState.x = clientX;
  pointerState.y = clientY;
};

const endPump = () => { pointerState.active = false; };

const updateGrab = () => {
  const grab = el('grab');
  grab.classList.toggle('on', pointerState.active);
  if (!pointerState.active) return;
  const top = Math.min(pointerState.anchorY, pointerState.y) - 20;
  const height = Math.abs(pointerState.anchorY - pointerState.y) + 40;
  grab.style.transform = 'translate(' + pointerState.x + 'px, ' + top + 'px)';
  grab.style.height = height + 'px';
  el('grab-dot').style.top = (pointerState.y - top - 14) + 'px';
};

const wireInput = () => {
  const stage = el('stage');
  stage.addEventListener('pointerdown', (ev) => {
    ev.preventDefault();
    stage.setPointerCapture(ev.pointerId);
    beginPump(ev.clientX, ev.clientY);
  });
  stage.addEventListener('pointermove', (ev) => {
    ev.preventDefault();
    movePump(ev.clientX, ev.clientY);
  });
  stage.addEventListener('pointerup', endPump);
  stage.addEventListener('pointercancel', endPump);

  el('btn-reset').addEventListener('click', () => { resetRun(false); showToast('RESET'); });

  /* Keyboard is a desktop convenience, so it drives the same axis by
   * ramping the target rather than snapping it. */
  const keys = { up: false, down: false };
  const applyKeys = () => {
    if (!keys.up && !keys.down) { pointerState.active = false; return; }
    pointerState.active = true;
    pointerState.anchorY = 0;
    pointerState.anchorPosture = run.posture;
    pointerState.target = keys.up ? 1 : 0;
  };
  window.addEventListener('keydown', (ev) => {
    if (ev.repeat) return;
    if (ev.code === 'KeyR') { resetRun(false); return; }
    if (ev.code === 'ArrowUp' || ev.code === 'KeyW' || ev.code === 'Space') keys.up = true;
    else if (ev.code === 'ArrowDown' || ev.code === 'KeyS') keys.down = true;
    else return;
    ev.preventDefault();
    applyKeys();
  });
  window.addEventListener('keyup', (ev) => {
    if (ev.code === 'ArrowUp' || ev.code === 'KeyW' || ev.code === 'Space') keys.up = false;
    else if (ev.code === 'ArrowDown' || ev.code === 'KeyS') keys.down = false;
    else return;
    ev.preventDefault();
    applyKeys();
  });
};

/* ------------------------------------------------------------------ *
 * Debug panel — built only when ?debug=1 is present.
 * Sliders write straight into CONFIG; nothing here caches a value.
 * ------------------------------------------------------------------ */
const decimalsFor = (step) => {
  if (step >= 1) return 0;
  const s = String(step);
  const dot = s.indexOf('.');
  return dot < 0 ? 0 : s.length - dot - 1;
};

const formatValue = (v, step) => v.toFixed(decimalsFor(step));

const serializeConfig = () => {
  const lines = ['const CONFIG = {'];
  const sections = Object.keys(CONFIG);
  for (let i = 0; i < sections.length; i++) {
    const section = sections[i];
    lines.push('  ' + section + ': {');
    const keys = Object.keys(CONFIG[section]);
    for (let k = 0; k < keys.length; k++) {
      const value = CONFIG[section][keys[k]];
      lines.push('    ' + keys[k] + ': ' + (Number.isInteger(value) ? value : Number(value.toFixed(6))) + ',');
    }
    lines.push('  },');
  }
  lines.push('};');
  return lines.join('\n');
};

const copyToClipboard = (text) => {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(
      () => showToast('CONFIG copied'),
      () => showToast('Copy blocked — see console')
    );
    return;
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('CONFIG copied');
  } catch (err) {
    showToast('Copy blocked — see console');
  }
  document.body.removeChild(ta);
};

/** "muscleStiffness" reads better as "muscle stiffness" on a phone. */
const prettyLabel = (param) => {
  if (param.label) return param.label;
  const leaf = param.path.split('.')[1];
  return leaf.replace(/([a-z0-9])([A-Z])/g, '$1 $2').toLowerCase();
};

const createDebugPanel = () => {
  const root = document.createElement('div');
  root.id = 'debug';

  const header = document.createElement('header');
  const title = document.createElement('span');
  title.textContent = 'TUNING';
  const spacer = document.createElement('span');
  spacer.className = 'spacer';
  const toggle = document.createElement('button');
  toggle.textContent = 'HIDE';
  toggle.addEventListener('click', () => {
    root.classList.toggle('collapsed');
    toggle.textContent = root.classList.contains('collapsed') ? 'SHOW' : 'HIDE';
  });
  header.appendChild(title);
  header.appendChild(spacer);
  header.appendChild(toggle);
  root.appendChild(header);

  const body = document.createElement('div');
  body.className = 'body';
  root.appendChild(body);

  const rows = [];
  const refreshAll = () => {
    for (let i = 0; i < rows.length; i++) rows[i]();
  };

  /* One slider. The same CONFIG path can appear twice — once under
   * Essentials and once in its home section — so every edit refreshes
   * every row rather than just its own, and the two stay in step. */
  const buildRow = (param, withHint) => {
    const row = document.createElement('div');
    row.className = 'dbg-row';

    const labelRow = document.createElement('div');
    labelRow.className = 'label';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = prettyLabel(param) + (param.rebuild ? ' ↻' : '');
    const val = document.createElement('span');
    val.className = 'val';
    labelRow.appendChild(name);
    labelRow.appendChild(val);
    row.appendChild(labelRow);

    if (withHint && param.hint) {
      const hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = param.hint;
      row.appendChild(hint);
    }

    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = String(param.min);
    slider.max = String(param.max);
    slider.step = String(param.step);

    const refresh = () => {
      const current = getPath(CONFIG, param.path);
      slider.value = String(current);
      val.textContent = formatValue(current, param.step);
      row.classList.toggle('dirty', current !== getPath(COMMITTED, param.path));
    };

    slider.addEventListener('input', () => {
      setPath(CONFIG, param.path, Number(slider.value));
      refreshAll();
      applyConfig();
      if (param.rebuild) scheduleRebuild();
    });

    refresh();
    rows.push(refresh);
    row.appendChild(slider);
    return row;
  };

  const addSection = (titleText, params, open, primary) => {
    const section = document.createElement('div');
    section.className = 'dbg-section' + (open ? '' : ' closed') + (primary ? ' primary' : '');
    const head = document.createElement('button');
    head.className = 'head';
    const caret = document.createElement('span');
    caret.className = 'caret';
    caret.textContent = '▾';
    const label = document.createElement('span');
    label.textContent = titleText;
    head.appendChild(caret);
    head.appendChild(label);
    head.addEventListener('click', () => section.classList.toggle('closed'));
    section.appendChild(head);

    const rowsWrap = document.createElement('div');
    rowsWrap.className = 'rows';
    for (let i = 0; i < params.length; i++) rowsWrap.appendChild(buildRow(params[i], primary));
    section.appendChild(rowsWrap);
    body.appendChild(section);
  };

  /* Sixty-eight sliders is not a tuning panel, it is a haystack. The
   * handful that actually change how the game feels come first, open,
   * with a line each saying what they do; everything else stays grouped
   * and shut underneath. */
  const essentials = [];
  for (let i = 0; i < PANEL_SPEC.length; i++) {
    for (let j = 0; j < PANEL_SPEC[i].params.length; j++) {
      if (PANEL_SPEC[i].params[j].key === true) essentials.push(PANEL_SPEC[i].params[j]);
    }
  }
  addSection('Start here', essentials, true, true);
  for (let i = 0; i < PANEL_SPEC.length; i++) addSection(PANEL_SPEC[i].title, PANEL_SPEC[i].params, false, false);

  const actions = document.createElement('div');
  actions.className = 'actions';

  const copyBtn = document.createElement('button');
  copyBtn.textContent = 'COPY CONFIG';
  copyBtn.addEventListener('click', () => copyToClipboard(serializeConfig()));

  const resetBtn = document.createElement('button');
  resetBtn.textContent = 'RESET TO COMMITTED';
  resetBtn.addEventListener('click', () => {
    const sections = Object.keys(COMMITTED);
    for (let i = 0; i < sections.length; i++) {
      const keys = Object.keys(COMMITTED[sections[i]]);
      for (let k = 0; k < keys.length; k++) CONFIG[sections[i]][keys[k]] = COMMITTED[sections[i]][keys[k]];
    }
    refreshAll();
    applyConfig();
    resetRun(true);
    showToast('Reset to committed');
  });

  actions.appendChild(copyBtn);
  actions.appendChild(resetBtn);
  root.appendChild(actions);
  document.body.appendChild(root);
};

let rebuildTimer = 0;
const scheduleRebuild = () => {
  clearTimeout(rebuildTimer);
  rebuildTimer = setTimeout(() => resetRun(true), 350);
};

/* ------------------------------------------------------------------ *
 * Config application — everything CONFIG touches outside the step loop
 * is re-pushed here, so a slider takes effect without a reload.
 * ------------------------------------------------------------------ */
let bodyContact = null;
let skiSnowContact = null;
const sunDir = new THREE.Vector3(-0.5, 0.8, 0.35);

const updateSun = () => {
  const p = skier.bodies.pelvis.position;
  sun.target.position.set(p.x, p.y, p.z);
  sun.target.updateMatrixWorld();
  sun.position.set(p.x + sunDir.x * 60, p.y + sunDir.y * 60, p.z + sunDir.z * 60);
};

const applyConfig = () => {
  world.gravity.set(0, CONFIG.physics.gravity, 0);
  world.solver.iterations = Math.round(CONFIG.physics.solverIterations);
  bodyContact.friction = CONFIG.physics.groundFriction;
  bodyContact.restitution = CONFIG.physics.restitution;
  bodyContact.contactEquationStiffness = CONFIG.physics.contactStiffness;
  bodyContact.contactEquationRelaxation = CONFIG.physics.contactRelaxation;
  skiSnowContact.restitution = CONFIG.physics.restitution;
  skiSnowContact.contactEquationStiffness = CONFIG.physics.contactStiffness;
  skiSnowContact.contactEquationRelaxation = CONFIG.physics.contactRelaxation;
  world.defaultContactMaterial.contactEquationStiffness = CONFIG.physics.contactStiffness;
  world.defaultContactMaterial.contactEquationRelaxation = CONFIG.physics.contactRelaxation;

  camera.fov = CONFIG.camera.fov;
  camera.updateProjectionMatrix();

  scene.fog.density = CONFIG.world.fogDensity;
  hemi.intensity = CONFIG.world.ambientLevel;
  sunDir.set(-0.55, Math.sin(CONFIG.world.sunElevation), 0.45 * Math.cos(CONFIG.world.sunElevation)).normalize();

};

/* ------------------------------------------------------------------ *
 * Main loop
 * ------------------------------------------------------------------ */
const frame = (now) => {
  requestAnimationFrame(frame);
  probe.frames++;
  const seconds = now * 0.001;
  let dt = clock.last === 0 ? 0.016 : seconds - clock.last;
  clock.last = seconds;
  dt = clamp(dt, 0, 0.1);

  const step = CONFIG.physics.fixedStep;
  const maxSteps = Math.round(CONFIG.physics.maxSubSteps);
  clock.accumulator += dt;
  let steps = 0;
  while (clock.accumulator >= step && steps < maxSteps) {
    stepGame(step);
    world.step(step);
    clock.accumulator -= step;
    steps++;
  }
  if (clock.accumulator > step * maxSteps) clock.accumulator = 0;

  syncMeshes();
  updateSun();
  updateCamera(dt);
  updateHud(dt);
  renderer.render(scene, camera);
};

const onResize = () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h, false);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
};

/* ------------------------------------------------------------------ *
 * Entry point
 * ------------------------------------------------------------------ */
const boot = () => {
  const canvas = el('stage');
  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setClearColor(0x9fc7ee);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fc7ee);
  scene.fog = new THREE.FogExp2(0xa8cdf0, CONFIG.world.fogDensity);

  camera = new THREE.PerspectiveCamera(CONFIG.camera.fov, 1, 0.1, 900);

  hemi = new THREE.HemisphereLight(0xdfefff, 0x88a0b8, CONFIG.world.ambientLevel);
  scene.add(hemi);
  sun = new THREE.DirectionalLight(0xfff4e0, 1.1);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -12;
  sun.shadow.camera.right = 12;
  sun.shadow.camera.top = 12;
  sun.shadow.camera.bottom = -12;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 140;
  sun.shadow.bias = -0.0012;
  scene.add(sun);
  scene.add(sun.target);

  world = new CANNON.World({ gravity: new CANNON.Vec3(0, CONFIG.physics.gravity, 0) });
  world.broadphase = new CANNON.SAPBroadphase(world);
  world.allowSleep = false;

  groundMaterial = new CANNON.Material('ground');
  bodyMaterial = new CANNON.Material('body');
  skiMaterial = new CANNON.Material('ski');
  bodyContact = new CANNON.ContactMaterial(groundMaterial, bodyMaterial, {
    friction: CONFIG.physics.groundFriction,
    restitution: CONFIG.physics.restitution,
  });
  /* Snow resistance under the skis is CONFIG.ski.glideDrag, not Coulomb
   * friction: cannon's friction force scales with contact count, and a
   * 1.7 m ski on a heightfield collects enough contacts to weld the
   * skier to the hill. */
  skiSnowContact = new CANNON.ContactMaterial(groundMaterial, skiMaterial, {
    friction: 0,
    restitution: CONFIG.physics.restitution,
  });
  world.addContactMaterial(bodyContact);
  world.addContactMaterial(skiSnowContact);

  buildTerrain();
  run.posture = CONFIG.pump.neutral;
  buildSkier();
  applyConfig();
  wireInput();
  onResize();
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);

  if (DEBUG) createDebugPanel();

  if (window.__skiBootWatchdog) clearTimeout(window.__skiBootWatchdog);
  probe.booted = true;
  probe.gl = Boolean(renderer.getContext());
  probe.debug = DEBUG;
  probe.run = run;
  probe.config = CONFIG;
  probe.pointer = pointerState;
  requestAnimationFrame(frame);
};

window.addEventListener('error', (ev) => fatal(ev.error || ev.message));
window.addEventListener('unhandledrejection', (ev) => fatal(ev.reason));

try {
  boot();
} catch (err) {
  fatal(err);
}
</script>

<script>
/* Classic script, parsed before the deferred module runs: if the module
 * never executes (import map miss, CDN down, offline) the page would
 * otherwise be a silent white rectangle on a phone. */
window.__skiBootWatchdog = setTimeout(function () {
  var box = document.getElementById('boot-error');
  box.style.display = 'block';
  box.textContent =
    'Ski Stunt 3D did not start within 8s.\n\n' +
    'The module script never ran. Usual causes:\n' +
    '  - no network, or the CDN in the import map is unreachable\n' +
    '  - the pinned three / cannon-es version does not exist\n' +
    '  - a syntax error in the module script\n\n' +
    'Import map:\n' +
    (document.querySelector('script[type=importmap]') || { textContent: '(missing)' }).textContent;
}, 8000);
</script>
</body>
</html>
