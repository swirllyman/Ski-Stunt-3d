<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d1b2a'/%3E%3Cpath d='M4 24h24' stroke='%235ec8ff' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M11 20l5-11 5 11' fill='none' stroke='%23eaf2ff' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Ski Stunt 3D</title>
<style>
  :root {
    --ink: #eaf2ff;
    --panel: rgba(9, 18, 32, 0.86);
    --edge: rgba(150, 190, 240, 0.28);
    --accent: #5ec8ff;
    --warn: #ff7a59;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0d1b2a; color: var(--ink);
    font: 14px/1.35 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; touch-action: none; display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed; left: 10px; top: calc(10px + var(--safe-t));
    padding: 8px 11px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--edge);
    backdrop-filter: blur(6px); pointer-events: none;
    font-variant-numeric: tabular-nums; min-width: 148px;
  }
  #hud .big { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  #hud .unit { font-size: 12px; opacity: 0.6; font-weight: 500; }
  #hud .row { display: flex; justify-content: space-between; gap: 14px; opacity: 0.82; font-size: 12px; }
  #hud .state { margin-top: 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: var(--accent); }
  #hud .state.crashed { color: var(--warn); }

  /* posture readout: the one number the whole game is about */
  #posture {
    position: fixed; right: 10px; top: calc(58px + var(--safe-t));
    width: 26px; height: 168px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--edge); overflow: hidden; pointer-events: none;
  }
  #posture .fill {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, var(--accent), rgba(94,200,255,0.25));
    transition: height 0.05s linear;
  }
  #posture .mark { position: absolute; left: 0; right: 0; height: 1px; background: rgba(234,242,255,0.45); }

  #toast {
    position: fixed; left: 50%; top: calc(64px + var(--safe-t)); transform: translateX(-50%);
    padding: 7px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--edge);
    font-weight: 600; opacity: 0; transition: opacity 0.25s ease; pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  #hint {
    position: fixed; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%);
    padding: 7px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--edge);
    font-size: 12px; font-weight: 600; letter-spacing: 0.4px; opacity: 0.75;
    pointer-events: none; transition: opacity 0.3s ease; white-space: nowrap;
  }
  #hint.hidden { opacity: 0; }
  /* Where the finger went down and where it is now. Two axes, so it is a
     ring and a dot rather than a slider track. */
  #grab { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.12s ease; }
  #grab.on { opacity: 1; }
  #grab .anchor, #grab .dot { position: absolute; border-radius: 50%; }
  #grab .anchor {
    width: 54px; height: 54px; margin: -27px 0 0 -27px;
    border: 2px dashed rgba(94,200,255,0.5);
  }
  #grab .dot {
    width: 30px; height: 30px; margin: -15px 0 0 -15px;
    border: 2px solid var(--accent); background: rgba(94,200,255,0.28);
  }
  /* The stick between the two is the input itself: its length and angle
   * are what the skier is being told to do, on both axes at once. */
  #grab .link {
    position: absolute; height: 2px; transform-origin: 0 50%;
    background: linear-gradient(90deg, rgba(94,200,255,0.15), rgba(94,200,255,0.75));
  }
  #btn-reset {
    position: fixed; right: 10px; top: calc(10px + var(--safe-t));
    padding: 9px 13px; border-radius: 12px; background: var(--panel);
    border: 1px solid var(--edge); color: var(--ink); font-weight: 700; font-size: 12px; letter-spacing: 0.6px;
  }

  /* Docked to the bottom rather than floated over the middle of the hill:
   * the skier sits around the centre of the screen, and a panel you have
   * to tune while watching cannot be parked on top of the thing you are
   * watching. Height is capped so the run stays visible above it. */
  #debug {
    position: fixed; left: 8px; bottom: calc(8px + var(--safe-b));
    width: min(330px, calc(100vw - 16px)); max-height: min(42vh, 380px);
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px;
    backdrop-filter: blur(8px); overflow: hidden; z-index: 20;
  }
  #debug.collapsed { max-height: none; }
  #debug header {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px 7px 12px;
    border-bottom: 1px solid var(--edge); font-weight: 700; letter-spacing: 0.6px; font-size: 11px;
  }
  #debug header .spacer { flex: 1; }
  #debug header button { padding: 5px 10px; font-size: 11px; }
  /* The three fixed strips keep their natural height and only the rows
   * scroll; without this the tabs get squeezed by the flex column and
   * the chips render clipped through the middle. */
  #debug header, #debug .tabs, #debug .actions { flex: 0 0 auto; }
  #debug .body { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 2px 0 6px; }
  #debug.collapsed .body, #debug.collapsed .actions, #debug.collapsed .tabs { display: none; }
  /* One row of group chips instead of eleven stacked headers: the panel
   * shows one group at a time, so its length is the longest group rather
   * than the sum of all of them, and switching is a tap not a scroll. */
  #debug .tabs {
    display: flex; align-items: center; gap: 5px; padding: 7px 10px; overflow-x: auto; overflow-y: hidden;
    border-bottom: 1px solid var(--edge); -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  #debug .tabs::-webkit-scrollbar { display: none; }
  #debug .tabs button {
    flex: 0 0 auto; padding: 5px 9px; border-radius: 999px; font: inherit; line-height: 1.2;
    font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; white-space: nowrap;
    background: rgba(150,190,240,0.09); border: 1px solid transparent; color: var(--ink); opacity: 0.6;
  }
  #debug .tabs button.on { background: rgba(94,200,255,0.16); border-color: var(--accent); color: var(--accent); opacity: 1; }
  #debug .tabs button.primary { color: #ffd166; opacity: 0.55; }
  #debug .tabs button.primary.on { background: rgba(255,209,102,0.14); border-color: #ffd166; color: #ffd166; }
  /* A dot on any group holding an edit, so what you changed is findable
   * without opening all thirteen of them. */
  #debug .tabs button.edited::after {
    content: ''; display: inline-block; width: 5px; height: 5px; margin-left: 5px;
    border-radius: 50%; background: #ffd166; vertical-align: middle;
  }
  #debug .caution { padding: 8px 12px 2px; font-size: 11px; line-height: 1.35; color: #ffd166; opacity: 0.75; }
  .dbg-row { padding: 5px 12px 7px; }
  .dbg-row .label { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; }
  .dbg-row .label .name { opacity: 0.85; }
  .dbg-row .label .val { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); }
  .dbg-row .hint { font-size: 11px; line-height: 1.3; opacity: 0.55; margin: 1px 0 0; }
  .dbg-row.dirty .label .val { color: #ffd166; }
  .dbg-row input[type=range] {
    width: 100%; height: 28px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none;
  }
  .dbg-row input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: rgba(150,190,240,0.3); }
  .dbg-row input[type=range]::-moz-range-track { height: 5px; border-radius: 3px; background: rgba(150,190,240,0.3); }
  .dbg-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 24px; height: 24px; margin-top: -10px; border-radius: 50%;
    background: var(--accent); border: 2px solid #04101d;
  }
  .dbg-row input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); border: 2px solid #04101d; }
  #debug .actions { display: flex; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--edge); }
  #debug .actions button { flex: 1; padding: 7px 6px; font-size: 11px; white-space: nowrap; }
  button {
    background: rgba(94, 200, 255, 0.16); color: var(--ink);
    border: 1px solid var(--edge); border-radius: 10px; padding: 11px 10px;
    font: inherit; font-weight: 700; font-size: 12px; letter-spacing: 0.5px;
  }
  button:active { background: rgba(94, 200, 255, 0.34); }
  #boot-error {
    position: fixed; inset: 0; display: none; padding: 24px; overflow: auto;
    background: #17070c; color: #ffd7cf; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; z-index: 99;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="hud">
  <div><span class="big" id="hud-speed">0</span> <span class="unit">km/h</span></div>
  <div class="row"><span>momentum</span><span id="hud-momentum">0</span></div>
  <div class="row"><span>distance</span><span id="hud-distance">0 m</span></div>
  <div class="row"><span>air</span><span id="hud-air">0.0 s</span></div>
  <div class="state" id="hud-state">ready</div>
</div>

<div id="posture"><div class="fill" id="posture-fill"></div><div class="mark" id="posture-mark"></div></div>

<button id="btn-reset">RESET</button>
<div id="toast"></div>

<div id="hint">touch anywhere &middot; &#8597; pump &middot; &#8596; lean</div>
<div id="grab"><div class="anchor" id="grab-anchor"></div><div class="link" id="grab-link"></div><div class="dot" id="grab-dot"></div></div>

<pre id="boot-error"></pre>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

/* ------------------------------------------------------------------ *
 * CONFIG — the single source of truth for every tunable number.
 * Contract in SKI_STUNT_3D_PIPELINE.md section 6; enforced both ways by
 * the smoke test, so a value added here must be read as CONFIG.<a>.<b>.
 * ------------------------------------------------------------------ */
const CONFIG = {
  physics: {
    gravity: -14,
    groundFriction: 0.3,
    restitution: 0.02,
    airDrag: 0.04,
    angularDrag: 0.12,
    solverIterations: 24,
    fixedStep: 0.004166,
    maxSubSteps: 14,
    contactStiffness: 10000000,
    contactRelaxation: 3,
  },
  ski: {
    glideDrag: 0.22,
    contactTolerance: 0.16,
    ankleStiffness: 4000,
    ankleDamping: 26,
  },
  pump: {
    neutral: 0.5,
    dragRange: 0.16,
    maxRate: 10,
    legDrive: 6,
    response: 30,
    releaseLag: 0.35,
  },
  /* The horizontal half of the stroke. Vertical pumps; horizontal shifts
   * weight fore and aft on the snow and drives rotation in the air. Same
   * gesture, and which one it means depends only on whether the skis are
   * touching — the reference game's whole trick. */
  lean: {
    dragRange: 0.22,
    response: 14,
    returnLag: 0.3,
    groundRange: 0.5,
    airTorque: 60,
    airDamping: 17,
    airLevel: 70,
    spinDrag: 4,
  },
  ragdoll: {
    muscleStiffness: 6000,
    muscleDamping: 155,
    limbMassScale: 1,
    torsoMassScale: 1,
    headStiffness: 90,
    headDamping: 12,
    balanceStiffness: 220,
    balanceDamping: 42,
    mirrorStiffness: 4000,
    mirrorDamping: 120,
    leanBias: 0,
    limpStiffness: 0.05,
    maxAngularSpeed: 34,
    maxJointTorque: 2500,
  },
  /* The two ends of the single control axis. Everything the player does
   * is a blend between these two postures — there is no jump button, so
   * how far apart these sit IS the pump. */
  crouch: { spine: -0.6, hip: 1.15, knee: -1.15, ankle: 0.5, shoulder: 1.2, neck: -0.1 },
  extend: { spine: 0.02, hip: 0.05, knee: -0.06, ankle: -0.12, shoulder: 0.15, neck: 0.06 },
  camera: { distance: 0, height: 2.4, framing: 14, lag: 0.12, fov: 45, lookAhead: 1 },
  /* Rollers must stay gentler than the hill. A sine of amplitude A and
   * wavelength L reaches a slope of 2*pi*A/L; once roller + chop exceed
   * tan(slopeAngle) the piste contains genuinely uphill sections, and a
   * skier with no propulsion simply stops in one. That is what happened:
   * 2*pi*1.4/26 + 2*pi*0.35/9 = 0.58 against a hill of 0.33. Keep the sum
   * under about 0.8 of tan(slopeAngle) until the pump can climb. */
  terrain: {
    slopeAngle: 0.32,
    length: 420,
    width: 60,
    elementSize: 1.5,
    rollerAmp: 0.7,
    rollerLength: 26,
    chopAmp: 0.1,
    chopLength: 9,
    lipAt: 150,
    lipHeight: 2.2,
    lipLength: 9,
    seed: 20260830,
  },
  world: { fogDensity: 0.008, sunElevation: 0.9, ambientLevel: 2.2 },
  rules: { crashHeight: 0.25, crashHold: 1.6, stallSpeed: 0.8, stallDelay: 2.5 },
};

const COMMITTED = JSON.parse(JSON.stringify(CONFIG));

const PANEL_SPEC = [
  {
    title: 'Pump',
    params: [
      { path: 'pump.dragRange', min: 0.03, max: 1, step: 0.01, key: true,
        label: 'slide distance', hint: 'how far your thumb travels for a full crouch-to-stand' },
      { path: 'pump.legDrive', min: 0, max: 12, step: 0.1, key: true,
        label: 'pop strength', hint: 'how much speed a full crouch-to-stand puts into the jump. The stroke has to be fast and it only counts on the snow' },
      { path: 'pump.maxRate', min: 0.5, max: 30, step: 0.5, key: true,
        label: 'extension speed', hint: 'how fast the legs may unfold. Sets the timing of a pop, not its height — leg strength does that' },
      { path: 'pump.neutral', min: 0, max: 1, step: 0.01, key: true,
        label: 'resting stance', hint: 'how bent the skier stands when you are not touching' },
      { path: 'pump.releaseLag', min: 0.02, max: 2, step: 0.02,
        label: 'release settle', hint: 'how slowly the body returns to rest after you let go' },
      { path: 'pump.response', min: 1, max: 120, step: 1, label: 'finger tracking' },
    ],
  },
  {
    title: 'Lean',
    params: [
      { path: 'lean.dragRange', min: 0.03, max: 1, step: 0.01, key: true,
        label: 'lean distance', hint: 'how far your thumb travels sideways for a full lean' },
      { path: 'lean.airTorque', min: 0, max: 240, step: 1, key: true,
        label: 'air rotation', hint: 'how hard sideways spins you in the air. This is your flip control' },
      { path: 'lean.groundRange', min: 0, max: 1.4, step: 0.02, key: true,
        label: 'weight shift', hint: 'how far forward/back you can throw your weight on the snow' },
      { path: 'lean.spinDrag', min: 0.2, max: 20, step: 0.1,
        label: 'spin top speed', hint: 'air drag on rotation. Lower spins faster: full lean tops out at air rotation divided by this' },
      { path: 'lean.airLevel', min: 0, max: 300, step: 5,
        label: 'self-righting', hint: 'how hard the skier finds level on its own with no input. Zero means every landing is yours to save' },
      { path: 'lean.airDamping', min: 0, max: 60, step: 0.5,
        label: 'settle damping', hint: 'stops self-righting from wobbling past level. Pairs with self-righting, not with spins' },
      { path: 'lean.response', min: 1, max: 120, step: 1, label: 'finger tracking' },
      { path: 'lean.returnLag', min: 0.02, max: 2, step: 0.02, label: 'centring speed' },
    ],
  },
  {
    title: 'Crouch',
    params: [
      { path: 'crouch.spine', min: -1.4, max: 0.4, step: 0.01 },
      { path: 'crouch.hip', min: -0.4, max: 1.8, step: 0.01 },
      { path: 'crouch.knee', min: -1.8, max: 0.3, step: 0.01, key: true,
        label: 'crouch depth (knee)', hint: 'more bend = more to push against = more pop' },
      { path: 'crouch.ankle', min: -0.8, max: 1, step: 0.01 },
      { path: 'crouch.shoulder', min: -0.6, max: 2, step: 0.01 },
      { path: 'crouch.neck', min: -0.8, max: 0.8, step: 0.01 },
    ],
  },
  {
    title: 'Extend',
    params: [
      { path: 'extend.spine', min: -1.4, max: 0.4, step: 0.01 },
      { path: 'extend.hip', min: -0.4, max: 1.8, step: 0.01 },
      { path: 'extend.knee', min: -1.8, max: 0.3, step: 0.01, key: true,
        label: 'stand height (knee)', hint: 'how straight the leg gets at the top of the stroke' },
      { path: 'extend.ankle', min: -0.8, max: 1, step: 0.01 },
      { path: 'extend.shoulder', min: -0.6, max: 2, step: 0.01 },
      { path: 'extend.neck', min: -0.8, max: 0.8, step: 0.01 },
    ],
  },
  {
    title: 'Body',
    params: [
      { path: 'ragdoll.muscleStiffness', min: 0, max: 60000, step: 200 },
      { path: 'ragdoll.muscleDamping', min: 0, max: 800, step: 2 },
      { path: 'ragdoll.limbMassScale', min: 0.25, max: 3, step: 0.05, rebuild: true },
      { path: 'ragdoll.torsoMassScale', min: 0.25, max: 3, step: 0.05, rebuild: true },
      { path: 'ragdoll.headStiffness', min: 0, max: 600, step: 5 },
      { path: 'ragdoll.headDamping', min: 0, max: 80, step: 0.5 },
      { path: 'ragdoll.balanceStiffness', min: 0, max: 900, step: 5 },
      { path: 'ragdoll.balanceDamping', min: 0, max: 250, step: 1 },
      { path: 'ragdoll.mirrorStiffness', min: 0, max: 40000, step: 200, key: true,
        label: 'leg pairing', hint: 'holds the two legs together above the skis. At zero the skis unlink too and the skier does the splits' },
      { path: 'ragdoll.mirrorDamping', min: 0, max: 600, step: 5, label: 'pairing damping' },
      { path: 'ragdoll.leanBias', min: -0.8, max: 0.8, step: 0.01 },
      { path: 'ragdoll.maxJointTorque', min: 20, max: 8000, step: 10, key: true,
        label: 'leg strength', hint: 'the hardest push the muscles are allowed. This, not pop speed, is what sets how high you get' },
    ],
  },
  {
    title: 'Skis',
    params: [
      { path: 'ski.ankleStiffness', min: 0, max: 12000, step: 50, key: true,
        label: 'ankle stiffness', hint: 'how much of the leg drive reaches the snow. Too soft and the ankle folds, the ski tips up and the pop goes nowhere' },
      { path: 'ski.glideDrag', min: 0, max: 2, step: 0.01, label: 'snow drag' },
      { path: 'ski.contactTolerance', min: 0.02, max: 0.6, step: 0.01, label: 'contact reach' },
      { path: 'ski.ankleDamping', min: 0, max: 300, step: 1, label: 'ankle damping' },
    ],
  },
  {
    title: 'Physics',
    params: [
      { path: 'physics.gravity', min: -60, max: -4, step: 0.5, key: true,
        label: 'gravity', hint: 'heavier makes everything faster and landings harsher' },
      { path: 'physics.groundFriction', min: 0, max: 2, step: 0.05, label: 'snow grip' },
      { path: 'physics.restitution', min: 0, max: 0.8, step: 0.01, label: 'bounciness' },
      { path: 'physics.airDrag', min: 0, max: 0.4, step: 0.005, label: 'air drag' },
      { path: 'physics.angularDrag', min: 0, max: 0.9, step: 0.01, label: 'tumble drag' },
    ],
  },
  {
    title: 'Camera',
    params: [
      { path: 'camera.distance', min: 0, max: 26, step: 0.25 },
      { path: 'camera.height', min: 0, max: 14, step: 0.1 },
      { path: 'camera.framing', min: 4, max: 60, step: 0.5, key: true,
        label: 'shot width (metres)', hint: 'how much hill fits across the screen. The camera pulls back to suit the phone, so this looks the same in portrait and landscape' },
      { path: 'camera.lag', min: 0.01, max: 0.9, step: 0.01 },
      { path: 'camera.fov', min: 25, max: 110, step: 1 },
      { path: 'camera.lookAhead', min: 0, max: 20, step: 0.5 },
    ],
  },
  {
    title: 'Terrain',
    params: [
      { path: 'terrain.slopeAngle', min: 0.02, max: 0.7, step: 0.01, rebuild: true, key: true,
        label: 'hill steepness', hint: 'rollers must stay gentler than this or the run stalls' },
      { path: 'terrain.rollerAmp', min: 0, max: 5, step: 0.05, rebuild: true, label: 'roller height' },
      { path: 'terrain.rollerLength', min: 6, max: 90, step: 1, rebuild: true, label: 'roller spacing' },
      { path: 'terrain.lipHeight', min: 0, max: 8, step: 0.1, rebuild: true, label: 'lip height' },
      { path: 'terrain.lipLength', min: 2, max: 40, step: 0.5, rebuild: true, label: 'lip length' },
      { path: 'terrain.lipAt', min: 20, max: 600, step: 5, rebuild: true, label: 'lip position' },
      { path: 'terrain.chopAmp', min: 0, max: 2, step: 0.05, rebuild: true, label: 'chatter height' },
      { path: 'terrain.chopLength', min: 3, max: 40, step: 0.5, rebuild: true, label: 'chatter spacing' },
      { path: 'terrain.length', min: 80, max: 900, step: 20, rebuild: true, label: 'run length' },
    ],
  },
  {
    title: 'Rules',
    params: [
      { path: 'rules.crashHeight', min: 0.05, max: 1, step: 0.01 },
      { path: 'rules.crashHold', min: 0.2, max: 5, step: 0.1 },
      { path: 'rules.stallSpeed', min: 0, max: 5, step: 0.1 },

  {

      { path: 'physics.fixedStep', min: 0.004, max: 0.02, step: 0.001 },
